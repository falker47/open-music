name: Android build and core tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare persistent QA signing
        if: github.event_name == 'push'
        env:
          QA_KEYSTORE_B64: ${{ secrets.OPEN_MUSIC_QA_KEYSTORE_B64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.OPEN_MUSIC_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.OPEN_MUSIC_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.OPEN_MUSIC_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$QA_KEYSTORE_B64" && -n "$QA_KEYSTORE_PASSWORD" && -n "$QA_KEY_ALIAS" && -n "$QA_KEY_PASSWORD" ]]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/open-music-signing"
            printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/open-music-signing/qa.jks"
            echo "QA_KEYSTORE_PATH=$RUNNER_TEMP/open-music-signing/qa.jks" >> "$GITHUB_ENV"
            echo "QA_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "QA_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::notice::Stable QA signing not configured; build only, no APK published."
          fi
      - name: Test and assemble debug APK
        env:
          QA_KEYSTORE_PASSWORD: ${{ secrets.OPEN_MUSIC_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.OPEN_MUSIC_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.OPEN_MUSIC_QA_KEY_PASSWORD }}
        run: gradle :core:test :app:assembleDebug --no-daemon --stacktrace
      # Debug variant uses the persistent user-owned key only when all four
      # secrets exist. Never distribute an APK signed by an ephemeral runner key.
      - name: Verify persistent QA certificate
        if: github.event_name == 'push' && env.QA_SIGNING_READY == 'true'
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      # Private QA releases only: a public repository or missing key must NOT
      # publish an update that could force uninstall and erase playlists.
      - name: Publish private signed QA prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/') && github.event.repository.private == true && env.QA_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" != "true" ]]; then
            echo "::error::Repository must remain private for QA distribution."
            exit 1
          fi
          TAG="qa-${GITHUB_SHA:0:12}"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'app-debug.apk'; then
              gh release upload "$TAG" "$FILE"
            fi
          else
            gh release create "$TAG" "$FILE" --prerelease --target "$GITHUB_SHA" --title "Open Music signed QA $TAG" --notes "Private Android QA APK. Signed with the persistent owner-owned QA key. Export playlists before any unavoidable one-time signer migration. No store publication."
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assetNames: [.assets[].name]}'
