name: Android build and core tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and assemble debug APK
        run: gradle :core:test :app:assembleDebug --no-daemon --stacktrace
      # Temporary QA mode: publish public debug builds without a persistent key.
      # Testers explicitly accept uninstall/reinstall and loss of local app data.
      # Do not publish private music, credentials or signing material.
      # A draft is not a reliable mobile download channel, even when an asset is uploaded.
      # Avoid Actions artifacts while this account's artifact storage quota is exhausted.
      - name: Publish experimental public QA prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="qa-${GITHUB_SHA:0:12}"
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Reruns must not overwrite existing assets, including immutable releases.
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'app-debug.apk'; then
              gh release upload "$TAG" "$FILE"
            fi
          else
            gh release create "$TAG" "$FILE" --prerelease --target "$GITHUB_SHA" --title "Open Music experimental QA $TAG" --notes "Public experimental debug APK for Android device QA. This build may use a different runner debug certificate than previous APKs. If Android refuses to update it, uninstall the old app and reinstall (this deletes locally stored playlists). No Play Store or stable release."
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assetNames: [.assets[].name]}'
